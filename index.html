<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Virtual EducaMadrid</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 450px; height: 600px; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background-color: #0056b3; color: white; padding: 15px; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #fafafa; }
        .message { padding: 10px 14px; border-radius: 15px; max-width: 80%; line-height: 1.4; font-size: 0.95rem; word-wrap: break-word; }
        .bot-message { background-color: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user-message { background-color: #0056b3; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input { display: flex; padding: 10px; border-top: 1px solid #ddd; background: white; }
        .chat-input input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; outline: none; margin-right: 8px; }
        .chat-input button { background: #0056b3; color: white; border: none; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .chat-input button:hover { background: #003d82; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 Asistente Virtual Administrativo
    </div>
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
            ¡Hola! 👋 ¿En qué puedo ayudarte hoy con tus consultas o trámites?
        </div>
    </div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Enviar</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = input.value.trim();

        if (!text) return;

        // Mostrar mensaje del usuario
        const userMsg = document.createElement('div');
        userMsg.className = 'message user-message';
        userMsg.innerText = text;
        chatBox.appendChild(userMsg);

        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // Indicador de "Escribiendo..."
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message bot-message';
        loadingMsg.id = 'loading';
        loadingMsg.innerText = 'Escribiendo respuesta...';
        chatBox.appendChild(loadingMsg);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/preguntar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pregunta: text })
            });

            const data = await response.json();
            
            // Quitar mensaje de carga
            const loadingElem = document.getElementById('loading');
            if (loadingElem) loadingElem.remove();

            // Mostrar respuesta del bot
            const botMsg = document.createElement('div');
            botMsg.className = 'message bot-message';
            botMsg.innerHTML = (data.respuesta || data.answer || "No se pudo obtener una respuesta.").replace(/\n/g, '<br>');
            chatBox.appendChild(botMsg);

        } catch (error) {
            const loadingElem = document.getElementById('loading');
            if (loadingElem) loadingElem.remove();

            const errorMsg = document.createElement('div');
            errorMsg.className = 'message bot-message';
            errorMsg.innerText = 'Error de conexión con el servidor.';
            chatBox.appendChild(errorMsg);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
